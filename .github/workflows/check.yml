name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: for file in *.sh; do bash -n "$file"; done
      - run: python -m unittest discover -s tests -p 'test_server.py'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_ui.py
      - run: python tests/test_comfort.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: bytecek-tv-kit
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bytecek-tv-kit
          path: dist
      - run: gh release create "$TAG" dist/* --repo "$REPO" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
